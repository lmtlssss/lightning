---
name: "Release Rust 🦀"
on:
  workflow_dispatch:
  push:
    branches:
      - "master"

jobs:
  release_rust:
    # Rust crates are published from the protected master branch only.
    # A manual dispatch on a contributor branch must never receive the token.
    if: github.repository == 'ElementsProject/lightning' && github.ref == 'refs/heads/master'
    environment: release-cargo
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: katyo/publish-crates@v2
        with:
          path: './cln-rpc'
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true
      - uses: katyo/publish-crates@v2
        with:
          path: './plugins'
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true
      - uses: katyo/publish-crates@v2
        with:
          path: './cln-grpc'
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true
      - uses: katyo/publish-crates@v2
        with:
          path: './lsps-types'
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true
