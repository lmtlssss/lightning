name: crates.io OIDC policy qualification (no credentials)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate, without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ci-crates-trusted-publishing-20261025
          persist-credentials: false
      - name: Validate candidate workflow syntax and OIDC isolation
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10 -shellcheck= .github/workflows/crate-io.yml
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('.github/workflows/crate-io.yml').read_text()
          assert "CARGO_REGISTRY_TOKEN" not in s
          assert "github.repository == 'ElementsProject/lightning'" in s
          assert "github.ref == 'refs/heads/master'" in s
          assert 'environment: release-cargo' in s
          assert 'id-token: write' in s
          assert 'contents: read' in s
          assert 'persist-credentials: false' in s
          assert s.count('steps.crates_auth.outputs.token') == 4
          assert s.count("ignore-unpublished-changes: true") == 4
          for path in ['cln-rpc','plugins','cln-grpc','lsps-types']:
              assert "path: './"+path+"'" in s
          refs=re.findall(r'uses:\s+(\S+)',s)
          assert len(refs)==7
          assert all(re.search(r'@[0-9a-f]{40}$',r) for r in refs),refs
          assert 'rust-lang/crates-io-auth-action@63a7064947ceca9989005e118db3a5fecdc9259f' in refs
          assert Path('.github/CRATES_TRUSTED_PUBLISHING.md').is_file()
          print("PASS: 11 source-policy checks, four publisher paths, SHA pins, no durable token")
          PY
      - name: Confirm no registry token, OIDC request or publishing in qualification
        run: echo 'PASS secret-free verification only'
